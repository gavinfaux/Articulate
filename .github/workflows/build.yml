name: Articulate Build

on:
  push:
    branches: [develop, main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_FOLDER: build/Release
      VSTEST_CONNECTION_TIMEOUT: 60
      DOTNET_SYSTEM_NET_DISABLEIPV6: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: dotnet/nbgv@v0.5.2
        with:
          setAllVars: true
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: src/Articulate.Web/Client/package.json
          run_install: false
      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: src/Articulate.Web/Client/.node-version
          cache: pnpm
          cache-dependency-path: src/Articulate.Web/Client/pnpm-lock.yaml
      - name: Build
        run: dotnet run --file build/build.cs -- build --client true --tests --sample --clean
      - name: Smoke-test package contents
        run: node build/smoke-package.mjs build/Release
      - name: Upload packages
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Articulate-${{ env.NBGV_SemVer2 }}
          path: |
            ${{ env.RELEASE_FOLDER }}/Articulate.[0-9]*.nupkg
            ${{ env.RELEASE_FOLDER }}/Articulate.[0-9]*.snupkg

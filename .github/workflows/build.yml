name: Articulate Build

on:
  # Feature branches are validated by their pull request; only shared and
  # release refs need a separate push build.
  push:
    branches:
      - develop
      - main
      - "release/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR and develop integration runs; preserve release runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  build:
    name: Build and test ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [v17, v18]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_FOLDER: build/Release
      # The actual test run is ~2s; 60s gives a 30x margin for testhost startup
      VSTEST_CONNECTION_TIMEOUT: 60
      DOTNET_SYSTEM_NET_DISABLEIPV6: 1
      # Temporary ImageSharp risk acceptance for this fork's test branch only.
      ARTICULATE_TESTING_AUDIT_EXCEPTION: >-
        ${{ github.repository == 'gavinfaux/Articulate' &&
            (github.ref == 'refs/heads/explore/e2e-first-testing' ||
             (github.head_ref == 'explore/e2e-first-testing' &&
              github.event.pull_request.head.repo.full_name == 'gavinfaux/Articulate')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.*.lock.json"

      - uses: dotnet/nbgv@v0.5.2
        with:
          setAllVars: true

      - name: Log Build Context
        run: |
          echo "Articulate Build Context"
          echo "Version: ${NBGV_SemVer2}"
          echo "Commit: ${NBGV_GitCommitIdShort}"
          echo "Date: ${NBGV_GitCommitDate}"
          if [ "${ARTICULATE_TESTING_AUDIT_EXCEPTION}" = "true" ]; then
            echo "::warning::Testing only: three ImageSharp advisories are temporarily exempt. ImageSharp 3.1.12 remains affected; package upload is disabled."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: src/Articulate.Web/Client/package.json
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "src/Articulate.Web/Client/.node-version"
          cache: "pnpm"
          cache-dependency-path: "src/Articulate.Web/Client/pnpm-lock.yaml"

      - name: Reset act client dependencies
        if: ${{ env.ACT == 'true' }}
        shell: bash
        run: rm -rf src/Articulate.Web/Client/node_modules src/Articulate.Web/Client/v17/node_modules src/Articulate.Web/Client/v18/node_modules

      - name: Relink act client dependencies
        if: ${{ env.ACT == 'true' }}
        working-directory: src/Articulate.Web/Client
        run: pnpm install --frozen-lockfile --force

      - name: Guard backoffice lane boundary
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ROOT="src/Articulate.Web/Client"
          leaked="$(
            git ls-files \
              "${CLIENT_ROOT}/v17/src" \
              "${CLIENT_ROOT}/v18/src" 2>/dev/null \
              || true
          )"
          if [ -n "${leaked}" ]; then
            echo "::error::Per-lane source under ${CLIENT_ROOT}/{v17,v18}/src/:"
            echo "${leaked}"
            echo "Move it to ${CLIENT_ROOT}/common/src/."
            exit 1
          fi
          echo "Lane boundary clean."

      - name: Build lane packages
        # Each matrix job has its own checkout and shared build outputs.
        run: dotnet run --file build/build.cs -- build --lane "${{ matrix.lane }}" --sample --clean

      - name: Inspect packages and run fresh native HTTP E2E
        run: dotnet run --file build/test.cs -- fresh --lane "${{ matrix.lane }}"

      - name: Resolve generated package versions
        shell: bash
        run: |
          set -euo pipefail

          package_version() {
            local directory="$1"
            local package
            package="$(find "$directory" -maxdepth 1 -type f -name 'Articulate.[0-9]*.nupkg' -print -quit)"
            [[ -n "$package" ]] || { echo "No Articulate package found in $directory" >&2; exit 1; }
            basename "$package" | sed -e 's/^Articulate\.//' -e 's/\.nupkg$//'
          }

          PACKAGE_VERSION="$(package_version build/Release/${{ matrix.lane }})"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Generated ${{ matrix.lane }} package: $PACKAGE_VERSION"

      - name: Upload lane packages
        if: ${{ !env.ACT && env.ARTICULATE_TESTING_AUDIT_EXCEPTION != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Articulate-${{ env.PACKAGE_VERSION }}
          # The sample theme supports the native/Docker test host, not release publication.
          path: |
            ${{ env.RELEASE_FOLDER }}/${{ matrix.lane }}/Articulate.[0-9]*.nupkg
            ${{ env.RELEASE_FOLDER }}/${{ matrix.lane }}/Articulate.[0-9]*.snupkg
